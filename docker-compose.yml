services:
  web:
    build:
      context: .
      dockerfile: dockerfile
    env_file:
      - .env
    expose:
      - "8000"
    volumes:
      - media_data:/app/media
      - static_data:/app/staticfiles
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/nginx/certs:ro
      - media_data:/app/media:ro
      - static_data:/app/staticfiles:ro
    depends_on:
      - web
    networks:
      - default
      - rede_compartilhada # Conecta o Nginx na mesma rede da API 2
    restart: unless-stopped

networks:
  rede_compartilhada:
    external: true

volumes:
  media_data:
  static_data:
